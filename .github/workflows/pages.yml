name: Deploy HR Dvizh to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public website
        run: |
          mkdir -p dist
          cp index.html app.js app.css pipeline-editor.js dist/
          touch dist/.nojekyll
          test -s dist/index.html
          ls -la dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
